
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Câu 12 - Passport và Credit Card</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <h2>Thông tin cá nhân</h2>

    <div class="container">
        <p>Passport:</p>

        <input type="radio" name="passport" value="Yes"> Yes
        <input type="radio" name="passport" value="No"> No

        <div id="nhapPassport">
            <p>Nhập thông tin Passport:</p>
            <input type="text" id="passportInfo"
                   placeholder="Nhập số Passport">
        </div>

        <hr>

        <p>Credit Card:</p>

        <input type="radio" name="creditCard" value="Yes"> Yes
        <input type="radio" name="creditCard" value="No"> No

        <div id="nhapCreditCard">
            <p>Nhập thông tin Credit Card:</p>
            <input type="text" id="creditCardInfo"
                   placeholder="Nhập thông tin thẻ">
        </div>
    </div>

</body>
</html>
