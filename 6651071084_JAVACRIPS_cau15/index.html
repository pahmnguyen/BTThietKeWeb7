
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Câu 15 - Tabs</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js" defer></script>
</head>
<body>

    <div class="container">

        <h2>Ví dụ về Tabs</h2>

        <div class="tab">
            <button class="tablinks active" data-tab="tab1">
                Trang chủ
            </button>

            <button class="tablinks" data-tab="tab2">
                Giới thiệu
            </button>

            <button class="tablinks" data-tab="tab3">
                Dịch vụ
            </button>

            <button class="tablinks" data-tab="tab4">
                Liên hệ
            </button>
        </div>

        <div id="tab1" class="tabcontent active">
            <h3>Trang chủ</h3>
            <p>Chào mừng bạn đến với trang web của chúng tôi.</p>
        </div>

        <div id="tab2" class="tabcontent">
            <h3>Giới thiệu</h3>
            <p>Đây là phần giới thiệu về trang web.</p>
        </div>

        <div id="tab3" class="tabcontent">
            <h3>Dịch vụ</h3>
            <p>Chúng tôi cung cấp các dịch vụ cho khách hàng.</p>
        </div>

        <div id="tab4" class="tabcontent">
            <h3>Liên hệ</h3>
            <p>Email: example@gmail.com</p>
        </div>

    </div>

</body>
</html>
